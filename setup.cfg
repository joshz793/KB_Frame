[metadata]
name = lessons-kb
version = attr: lessons_kb.__version__
description = A lessons-learned knowledge base for computational work, kept by people and AI agents
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.6
install_requires =
    numpy
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
lessons_kb = profiles/*/*.py, profiles/*/*.json, profiles/*/*.md, profiles/*/examples/*

[options.entry_points]
console_scripts =
    kbcli = lessons_kb.cli:main
